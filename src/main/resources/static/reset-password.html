<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 地址栏里有重置令牌:不把它通过 Referer 带给其他网站 -->
  <meta name="referrer" content="no-referrer">
  <title>重置密码 - 行程预约</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>重置密码</h1>
    <p class="sub">为你的行程预约账号设置一个新密码</p>
    <p class="muted" id="checking">正在检查链接…</p>
    <div id="invalid" hidden>
      <div class="warn-box">这个重置链接无效或已过期(链接 30 分钟内有效,只能使用一次,再次申请后旧链接失效)。</div>
      <a class="btn primary block" href="/login.html">返回登录页重新申请</a>
    </div>
    <form id="form" novalidate hidden>
      <div class="field">
        <label for="newPassword">新密码</label>
        <input id="newPassword" name="newPassword" type="password" required maxlength="64" autocomplete="new-password" autofocus>
        <span class="help">8~64 位,同时包含字母和数字</span>
      </div>
      <div class="field">
        <label for="confirm">确认新密码</label>
        <input id="confirm" name="confirm" type="password" required autocomplete="new-password">
      </div>
      <button class="primary" id="submit">设置新密码</button>
      <p class="error" id="error" role="alert"></p>
    </form>
  </div>
</div>
<script src="/js/common.js"></script>
<script>
  // 令牌只在内存里用:读出来后立即从地址栏去掉,避免留在浏览历史或被截图
  const token = new URLSearchParams(location.search).get('token') || '';
  history.replaceState(null, '', location.pathname);

  (async function check() {
    let valid = false;
    if (token) {
      try { valid = (await api('GET', '/auth/reset-password?token=' + encodeURIComponent(token))).valid; } catch (e) { valid = false; }
    }
    $('#checking').hidden = true;
    $('#invalid').hidden = valid;
    $('#form').hidden = !valid;
    if (valid) $('#newPassword').focus();
  })();

  $('#form').onsubmit = async (ev) => {
    ev.preventDefault();
    const pw = $('#newPassword').value, again = $('#confirm').value;
    const err = $('#error');
    err.textContent = '';
    if (!/^(?=.*[A-Za-z])(?=.*\d).{8,64}$/.test(pw)) { err.textContent = '密码为 8~64 位,且同时包含字母和数字'; return; }
    if (pw !== again) { err.textContent = '两次输入的密码不一致'; return; }
    $('#submit').disabled = true;
    try {
      await api('POST', '/auth/reset-password', { token, newPassword: pw });
      location.replace('/login.html?reset=1');
    } catch (e) {
      err.textContent = e.message;
      if (/无效|过期/.test(e.message)) { $('#form').hidden = true; $('#invalid').hidden = false; }
    } finally {
      $('#submit').disabled = false;
    }
  };
</script>
</body>
</html>
